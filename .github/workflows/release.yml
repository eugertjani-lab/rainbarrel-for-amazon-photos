name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    name: macOS build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain
        run: swift --version

      - name: Build Rainbarrel.app
        run: scripts/build-app.sh

      - name: Build rainbarrel for arm64 and x86_64
        run: swift build -c release --product rainbarrel --arch arm64 --arch x86_64

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          ditto -c -k --keepParent build/Rainbarrel.app "dist/Rainbarrel-${TAG}-macos.zip"
          scripts/build-dmg.sh --skip-build
          cp build/Rainbarrel-*.dmg "dist/Rainbarrel-${TAG}-macos.dmg"

          BIN="$(swift build -c release --product rainbarrel --arch arm64 --arch x86_64 --show-bin-path)"
          cp "$BIN/rainbarrel" stage/rainbarrel
          cp LICENSE stage/LICENSE
          # A fat binary needs one signature that covers both slices; ad hoc is enough to run.
          codesign --force --sign - --timestamp=none stage/rainbarrel
          lipo -info stage/rainbarrel
          stage/rainbarrel --version
          tar -czf "dist/rainbarrel-${TAG}-macos-universal.tar.gz" -C stage rainbarrel LICENSE
          ls -l dist

      - name: Upload macOS files
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Show the toolchain
        run: swift --version

      - name: Build rainbarrel (release)
        run: swift build -c release --product rainbarrel

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "$(swift build -c release --product rainbarrel --show-bin-path)/rainbarrel" stage/rainbarrel
          cp LICENSE stage/LICENSE
          stage/rainbarrel --version
          tar -czf "dist/rainbarrel-${TAG}-linux-$(uname -m).tar.gz" -C stage rainbarrel LICENSE
          ls -l dist

      - name: Upload Linux files
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the build files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum Rainbarrel-*-macos.zip Rainbarrel-*-macos.dmg rainbarrel-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Rainbarrel for Amazon Photos is an unofficial tool and is not affiliated with Amazon.

          Rainbarrel.app is ad-hoc signed and is not notarized by Apple. On first launch, right-click the app and choose Open, or clear the quarantine flag with `xattr -dr com.apple.quarantine Rainbarrel.app`. Rainbarrel reads your library either from the local index of the Amazon Photos desktop app or, after you sign in to Amazon in Rainbarrel, through Amazon's web API, so the desktop app is optional. Downloads use Amazon's private web API, which Amazon can change at any time.

          Check a download against `SHA256SUMS.txt` with `shasum -a 256 -c SHA256SUMS.txt --ignore-missing`.

          NOTES
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes
